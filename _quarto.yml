project:
  type: book
  output-dir: _book

book:
  title: "Design Verification"
  subtitle: "From First Principles to Agentic AI"
  author: "Mayur Kubavat"
  date: today
  date-format: "MMMM YYYY"
  chapters:
    - index.qmd
    - chapters/ch01-what-is-dv.qmd
    - chapters/ch02-verification-planning.qmd
    - chapters/ch03-digital-design-for-verifiers.qmd
    - chapters/ch04-simulation-fundamentals.qmd
    - chapters/ch05-testbench-language.qmd
    - chapters/ch06-oop-testbench-design.qmd
    - chapters/ch34-generative-ai-agentic-dv.qmd
    - references.qmd
  appendices:
    - appendices/appF-building-examples.qmd
    - appendices/appI-agent-tool-layer.qmd
  repo-url: https://github.com/mayurkubavat/dv-handbook
  site-url: https://mayurkubavat.github.io/dv-handbook
  license: "CC BY-NC-SA 4.0"

bibliography: refs.bib

filters:
  - theme/include-code.lua

format:
  pdf:
    documentclass: scrbook
    classoption: [oneside, open=any]
    pdf-engine: xelatex
    geometry:
      - paperwidth=7in
      - paperheight=10in
      - top=0.9in
      - bottom=0.95in
      - inner=0.9in
      - outer=1.0in
    mainfont: "Source Serif 4"
    sansfont: "Source Sans 3"
    monofont: "JetBrains Mono"
    monofontoptions:
      - Scale=0.82
      # JetBrains Mono ships programming ligatures, so `<=` rendered as a
      # single glyph in every listing and in verbatim simulator output. A
      # chapter that tells the reader to change four `<` characters printed
      # a page with no `<` on it.
      - "RawFeature=-calt"
    fontsize: 10pt
    linestretch: 1.12
    include-in-header: theme/preamble.tex
    colorlinks: true
    linkcolor: siliconblue
    urlcolor: siliconblue
    citecolor: siliconblue
    highlight-style: theme/dv-highlight.theme
    code-block-bg: "#F4F6F8"
    code-block-border-left: "#1B4F72"
    code-overflow: wrap
    toc: true
    toc-depth: 2
    number-sections: true
    number-depth: 2
    lof: false
    keep-tex: false
  html:
    theme:
      light: [cosmo, theme/book.scss]
    toc: true
    number-sections: true
    code-copy: true
    highlight-style: theme/dv-highlight.theme
