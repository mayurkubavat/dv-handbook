<rect x="245.0" y="340.0" width="190.0" height="50.0" rx="5" fill="#E6F2E7" stroke="#2E7D32" stroke-width="1.5"/>
<text x="340.0" y="361.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1C1C1C">the ring</text>
<text x="340.0" y="378.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1C1C1C">proven</text>
