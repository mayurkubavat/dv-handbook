<text x="840.0" y="378.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1C1C1C">cex, depth 3</text>
<text x="40.0" y="420.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#7FA3C0">The register in each block means a guarantee at cycle t + 1 needs the other&#x27;s only up to cycle t.</text>
<text x="40.0" y="442.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#7FA3C0">Lasso: x and y reset to 0 and pass 0 to each other for ever.</text>
