<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1080" width="1200" height="1080" role="img" aria-label="The regions of one SystemVerilog timestep, in order, with the loops between them">
<rect width="1200" height="1080" fill="white"/>
<text x="30" y="40" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#1B4F72">One timestep</text>
<text x="30" y="64" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1C1C1C">Order between regions is fixed. Order within a region is not.</text>
<rect x="300" y="100" width="230" height="54" rx="8" fill="white" stroke="#1B4F72" stroke-width="2"/>
<text x="415.0" y="133.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#1C1C1C">Preponed</text>
<text x="570" y="122.5" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1C1C1C">sample the values concurrent assertions will use;</text>
<text x="570" y="143.5" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1C1C1C">once per timestep</text>
<rect x="270" y="194" width="810" height="262" rx="14" fill="#F4F6F8" stroke="#7FA3C0" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="260" y="224" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" text-anchor="end" fill="#1B4F72">Active set</text>
<text x="260" y="246" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="end" fill="#7FA3C0">the design</text>
<rect x="300" y="214" width="230" height="54" rx="8" fill="#1B4F72" stroke="#1B4F72" stroke-width="2"/>
<text x="415.0" y="247.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="white">Active</text>
<text x="570" y="236.5" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1C1C1C">blocking assignments; right side of &lt;=;</text>
<text x="570" y="257.5" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1C1C1C">continuous assignments; $display</text>
