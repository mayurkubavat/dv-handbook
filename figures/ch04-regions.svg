<path d="M408.0,485 L415.0,496 L422.0,485 Z" fill="#7FA3C0"/>
<rect x="270" y="590" width="810" height="262" rx="14" fill="#F4F6F8" stroke="#7FA3C0" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="260" y="620" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" text-anchor="end" fill="#1B4F72">Reactive set</text>
<text x="260" y="642" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="end" fill="#7FA3C0">the testbench&#x27;s dual</text>
<rect x="300" y="610" width="230" height="54" rx="8" fill="#5B3E8E" stroke="#1B4F72" stroke-width="2"/>
<text x="415.0" y="643.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="white">Reactive</text>
<text x="570" y="632.5" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1C1C1C">code in a program block;</text>
<text x="570" y="653.5" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1C1C1C">assertion action blocks</text>
