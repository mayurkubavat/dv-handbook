<text x="570" y="727.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1C1C1C">the testbench&#x27;s counterpart of Inactive</text>
