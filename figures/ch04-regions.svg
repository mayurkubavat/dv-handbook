<path d="M542,630.0 L531,637.0 L542,644.0 Z" fill="#2E7D32"/>
<path d="M1090,805.0 H1155 V241.0 H1102" stroke="#B7791F" stroke-width="2.5" fill="none" stroke-dasharray="9 6"/>
<path d="M1102,234.0 L1091,241.0 L1102,248.0 Z" fill="#B7791F"/>
<text x="1141" y="519.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="end" fill="#B7791F">the testbench may</text>
<text x="1141" y="539.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="end" fill="#B7791F">wake the design again</text>
<rect x="300" y="892" width="230" height="54" rx="8" fill="white" stroke="#1B4F72" stroke-width="2"/>
<text x="415.0" y="925.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#1C1C1C">Postponed</text>
<text x="570" y="914.5" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1C1C1C">$strobe and $monitor; read-only:</text>
<text x="570" y="935.5" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1C1C1C">nothing may schedule new work here</text>
