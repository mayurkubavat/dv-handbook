<text x="415.0" y="1020" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1B4F72">time advances only when every region is empty</text>
<path d="M30,1053 H70" stroke="#2E7D32" stroke-width="2.5"/>
<text x="78" y="1058" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1C1C1C">new work in the same set: iterate within the timestep</text>
<path d="M520,1053 H560" stroke="#B7791F" stroke-width="2.5" stroke-dasharray="9 6"/>
<text x="568" y="1058" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1C1C1C">testbench activity that wakes design processes</text>
