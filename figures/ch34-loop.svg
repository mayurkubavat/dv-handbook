<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 470" width="1400" height="470" role="img" aria-label="The agent loop with its four failure points, beside the coverage-driven loop">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7FA3C0"/></marker><marker id="ahj" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#5B3E8E"/></marker></defs>
<rect width="1400" height="470" fill="white"/>
<rect x="20" y="20" width="680" height="430" rx="12" fill="none" stroke="#7FA3C0" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="32" y="40.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#7FA3C0">The agent loop</text>
<rect x="60" y="80" width="170" height="64" rx="32.0" fill="#1B4F72" stroke="#123A56" stroke-width="2"/>
<text x="145.0" y="109.6" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="white">Plan</text>
<text x="145.0" y="130.2" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#DCE9F3">what to do next</text>
<rect x="400" y="80" width="170" height="64" rx="6" fill="white" stroke="#1B4F72" stroke-width="2"/>
<text x="485.0" y="109.2" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#1C1C1C">Act</text>
<text x="485.0" y="130.2" font-family="'JetBrains Mono', Menlo, monospace" font-size="12" font-weight="400" text-anchor="middle" fill="#7FA3C0">a tool call</text>
<path d="M400,270 A85.0,10 0 0 1 570,270 V320 A85.0,10 0 0 1 400,320 Z" fill="#F4F6F8" stroke="#1B4F72" stroke-width="2"/>
<path d="M400,270 A85.0,10 0 0 0 570,270" fill="none" stroke="#1B4F72" stroke-width="2"/>
<text x="485.0" y="297.2" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#1C1C1C">Observe</text>
<text x="485.0" y="317.2" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#7FA3C0">the result</text>
<rect x="60" y="260" width="170" height="64" rx="32.0" fill="#1B4F72" stroke="#123A56" stroke-width="2"/>
<text x="145.0" y="289.6" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="white">Stop?</text>
<text x="145.0" y="310.2" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#DCE9F3">decide</text>
<path d="M230,112.0 L400,112.0" fill="none" stroke="#7FA3C0" stroke-width="2.2" marker-end="url(#ah)"/>
<path d="M485.0,144 L485.0,260" fill="none" stroke="#7FA3C0" stroke-width="2.2" marker-end="url(#ah)"/>
<path d="M400,295.0 L230,292.0" fill="none" stroke="#7FA3C0" stroke-width="2.2" marker-end="url(#ah)"/>
<path d="M145.0,260 L145.0,144" fill="none" stroke="#7FA3C0" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="145.0" y="198.2" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1C1C1C">no: loop</text>
<circle cx="150" cy="150" r="12" fill="#B7791F"/>
<text x="150" y="154.6" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="white">1</text>
<circle cx="490" cy="150" r="12" fill="#B7791F"/>
<text x="490" y="154.6" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="white">2</text>
<circle cx="330" cy="300" r="12" fill="#B7791F"/>
<text x="330" y="304.6" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="white">3</text>
<circle cx="150" cy="330" r="12" fill="#B7791F"/>
<text x="150" y="334.6" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="white">4</text>
<rect x="60" y="380" width="600" height="30" rx="6" fill="#F4F6F8" stroke="#CBD2D9"/>
<text x="70" y="400.4" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#1C1C1C">Failure points:  1 wrong plan  ·  2 wrong tool call  ·  3 misread result  ·  4 wrong stopping decision (the one that matters most)</text>
<rect x="720" y="20" width="660" height="430" rx="12" fill="none" stroke="#7FA3C0" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="732" y="40.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#7FA3C0">The coverage-driven loop</text>
<rect x="760" y="80" width="190" height="60" rx="6" fill="white" stroke="#1B4F72" stroke-width="2"/>
<text x="855.0" y="115.2" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#1C1C1C">Write stimulus</text>
<rect x="1100" y="80" width="190" height="60" rx="6" fill="white" stroke="#1B4F72" stroke-width="2"/>
<text x="1195.0" y="107.2" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#1C1C1C">Run</text>
<text x="1195.0" y="128.2" font-family="'JetBrains Mono', Menlo, monospace" font-size="12" font-weight="400" text-anchor="middle" fill="#7FA3C0">simulator</text>
<path d="M1100,270 A95.0,10 0 0 1 1290,270 V310 A95.0,10 0 0 1 1100,310 Z" fill="#F4F6F8" stroke="#1B4F72" stroke-width="2"/>
<path d="M1100,270 A95.0,10 0 0 0 1290,270" fill="none" stroke="#1B4F72" stroke-width="2"/>
<text x="1195.0" y="299.2" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#1C1C1C">Coverage report</text>
<rect x="760" y="260" width="190" height="60" rx="30.0" fill="#1B4F72" stroke="#123A56" stroke-width="2"/>
<text x="855.0" y="287.6" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="white">Enough?</text>
<text x="855.0" y="308.2" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#DCE9F3">stopping signal</text>
<path d="M950,110.0 L1100,110.0" fill="none" stroke="#7FA3C0" stroke-width="2.2" marker-end="url(#ah)"/>
<path d="M1195.0,140 L1195.0,260" fill="none" stroke="#7FA3C0" stroke-width="2.2" marker-end="url(#ah)"/>
<path d="M1100,290.0 L950,290.0" fill="none" stroke="#7FA3C0" stroke-width="2.2" marker-end="url(#ah)"/>
<path d="M855.0,260 L855.0,140" fill="none" stroke="#7FA3C0" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="855.0" y="196.2" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1C1C1C">no: another test</text>
<rect x="760" y="370" width="580" height="46" rx="6" fill="#F4F6F8" stroke="#CBD2D9"/>
<text x="770" y="390.4" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#1C1C1C">The stopping signal is coverage. The goal is bugs found. They are not the same,</text>
<text x="770" y="406.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#1C1C1C">which is why coverage is a proxy the discipline learned not to trust.</text>
</svg>
