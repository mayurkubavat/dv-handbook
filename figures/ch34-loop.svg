<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" width="1000" height="900" role="img" aria-label="The agent loop with its four failure points, beside the coverage-driven loop">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7FA3C0"/></marker><marker id="ahj" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#5B3E8E"/></marker></defs>
<rect width="1000" height="900" fill="white"/>
<rect x="20" y="20" width="960" height="420" rx="12" fill="none" stroke="#7FA3C0" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="32" y="42.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#7FA3C0">The agent loop</text>
<rect x="60" y="80" width="220" height="64" rx="32.0" fill="#1B4F72" stroke="#123A56" stroke-width="2"/>
<text x="170.0" y="110.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="white">Plan</text>
<text x="170.0" y="133.9" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#DCE9F3">what to do next</text>
<rect x="640" y="80" width="220" height="64" rx="6" fill="white" stroke="#1B4F72" stroke-width="2"/>
<text x="750.0" y="109.7" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1C1C1C">Act</text>
<text x="750.0" y="133.9" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="400" text-anchor="middle" fill="#7FA3C0">a tool call</text>
<path d="M640,260 A110.0,10 0 0 1 860,260 V310 A110.0,10 0 0 1 640,310 Z" fill="#F4F6F8" stroke="#1B4F72" stroke-width="2"/>
<path d="M640,260 A110.0,10 0 0 0 860,260" fill="none" stroke="#1B4F72" stroke-width="2"/>
<text x="750.0" y="287.6" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1C1C1C">Observe</text>
<text x="750.0" y="309.9" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#7FA3C0">the result</text>
<rect x="60" y="250" width="220" height="64" rx="32.0" fill="#1B4F72" stroke="#123A56" stroke-width="2"/>
<text x="170.0" y="280.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="white">Stop?</text>
<text x="170.0" y="303.9" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#DCE9F3">decide</text>
<path d="M280,112.0 L640,112.0" fill="none" stroke="#7FA3C0" stroke-width="2.2" marker-end="url(#ah)"/>
<path d="M750.0,144 L750.0,250" fill="none" stroke="#7FA3C0" stroke-width="2.2" marker-end="url(#ah)"/>
<path d="M640,285.0 L280,282.0" fill="none" stroke="#7FA3C0" stroke-width="2.2" marker-end="url(#ah)"/>
<path d="M170.0,250 L170.0,144" fill="none" stroke="#7FA3C0" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="170.0" y="194.2" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1C1C1C">no: loop</text>
<circle cx="170" cy="150" r="12" fill="#B7791F"/>
<text x="170" y="155.2" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="white">1</text>
<circle cx="750" cy="150" r="12" fill="#B7791F"/>
<text x="750" y="155.2" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="white">2</text>
<circle cx="460" cy="300" r="12" fill="#B7791F"/>
<text x="460" y="305.2" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="white">3</text>
<circle cx="170" cy="320" r="12" fill="#B7791F"/>
<text x="170" y="325.2" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="white">4</text>
<rect x="60" y="350" width="890" height="34" rx="6" fill="#F4F6F8" stroke="#CBD2D9"/>
<text x="70" y="372.5" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1C1C1C">1 wrong plan  ·  2 wrong tool call  ·  3 misread result  ·  4 wrong stopping decision (the one that matters most)</text>
<rect x="20" y="460" width="960" height="420" rx="12" fill="none" stroke="#7FA3C0" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="32" y="482.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#7FA3C0">The coverage-driven loop</text>
<rect x="60" y="520" width="220" height="64" rx="6" fill="white" stroke="#1B4F72" stroke-width="2"/>
<text x="170.0" y="558.6" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1C1C1C">Write stimulus</text>
<rect x="640" y="520" width="220" height="64" rx="6" fill="white" stroke="#1B4F72" stroke-width="2"/>
<text x="750.0" y="549.6" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1C1C1C">Run</text>
<text x="750.0" y="573.9" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="400" text-anchor="middle" fill="#7FA3C0">simulator</text>
<path d="M640,700 A110.0,10 0 0 1 860,700 V744 A110.0,10 0 0 1 640,744 Z" fill="#F4F6F8" stroke="#1B4F72" stroke-width="2"/>
<path d="M640,700 A110.0,10 0 0 0 860,700" fill="none" stroke="#1B4F72" stroke-width="2"/>
<text x="750.0" y="732.6" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1C1C1C">Coverage report</text>
<rect x="60" y="690" width="220" height="64" rx="32.0" fill="#1B4F72" stroke="#123A56" stroke-width="2"/>
<text x="170.0" y="720.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="white">Enough?</text>
<text x="170.0" y="743.9" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#DCE9F3">stopping signal</text>
<path d="M280,552.0 L640,552.0" fill="none" stroke="#7FA3C0" stroke-width="2.2" marker-end="url(#ah)"/>
<path d="M750.0,584 L750.0,690" fill="none" stroke="#7FA3C0" stroke-width="2.2" marker-end="url(#ah)"/>
<path d="M640,722.0 L280,722.0" fill="none" stroke="#7FA3C0" stroke-width="2.2" marker-end="url(#ah)"/>
<path d="M170.0,690 L170.0,584" fill="none" stroke="#7FA3C0" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="170.0" y="634.2" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1C1C1C">no: another test</text>
<rect x="60" y="790" width="890" height="54" rx="6" fill="#F4F6F8" stroke="#CBD2D9"/>
<text x="70" y="812.5" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1C1C1C">The stopping signal is coverage. The goal is bugs found. They are not the same,</text>
<text x="70" y="832.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1C1C1C">which is why coverage is a proxy the discipline learned not to trust.</text>
</svg>
