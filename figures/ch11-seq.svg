<rect x="287.0" y="90.0" width="126.0" height="44.0" rx="6" fill="white" stroke="#1B4F72" stroke-width="2"/>
<text x="350" y="117.2" font-family="'JetBrains Mono', Menlo, monospace" font-size="15" font-weight="700" text-anchor="middle" fill="#1C1C1C">dma_model</text>
