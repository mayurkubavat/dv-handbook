<path d="M70.0,170.0 L206.0,170.0" fill="none" stroke="#1C1C1C" stroke-width="1.4" marker-end="url(#ahg)"/>
<text x="140.0" y="164.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="500" text-anchor="middle" fill="#1C1C1C">start(0, src, dst, 1)</text>
