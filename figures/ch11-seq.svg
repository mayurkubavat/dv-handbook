<text x="630" y="117.2" font-family="'JetBrains Mono', Menlo, monospace" font-size="15" font-weight="700" text-anchor="middle" fill="#1C1C1C">axil_slave</text>
<line x1="630.0" y1="134.0" x2="630.0" y2="730.0" stroke="#7FA3C0" stroke-width="1.5" stroke-dasharray="5 4"/>
