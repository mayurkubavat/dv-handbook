<text x="560.0" y="416.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="500" text-anchor="middle" fill="#1C1C1C">AW: dst  W: word</text>
<path d="M630.0,458.0 L494.0,458.0" fill="none" stroke="#1B4F72" stroke-width="2.2" marker-end="url(#ahd)"/>
<text x="560.0" y="452.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="500" text-anchor="middle" fill="#1C1C1C">B: OKAY</text>
<path d="M775.0,494.0 L916.0,494.0" fill="none" stroke="#5B3E8E" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ahj)"/>
<text x="847.5" y="488.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="500" text-anchor="middle" fill="#5B3E8E">observe(write)</text>
<path d="M70.0,530.0 L206.0,530.0" fill="none" stroke="#1C1C1C" stroke-width="1.4" marker-end="url(#ahg)"/>
<text x="140.0" y="524.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="500" text-anchor="middle" fill="#1C1C1C">wait_idle()</text>
