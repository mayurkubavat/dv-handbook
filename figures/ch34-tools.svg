<text x="40" y="400.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#7FA3C0">A simulation is an expensive tool call. The loop is designed around that cost.</text>
</svg>
