<text x="190.0" y="160.6" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1C1C1C">(name, arguments)</text>
<path d="M80,252.0 Q20.0,172.0 80,92.0" fill="none" stroke="#7FA3C0" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="50.0" y="177.2" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1C1C1C">result</text>
<rect x="320" y="20" width="660" height="520" rx="12" fill="none" stroke="#7FA3C0" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="332" y="42.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#7FA3C0">Sandbox: a place the agent can break</text>
<rect x="350" y="80" width="260" height="76" rx="6" fill="white" stroke="#1B4F72" stroke-width="2"/>
<text x="480.0" y="115.7" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1C1C1C">Tool server</text>
<text x="480.0" y="139.9" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="400" text-anchor="middle" fill="#7FA3C0">advertises name, schema</text>
<path d="M300,252.0 Q325.0,125.0 350,118.0" fill="none" stroke="#7FA3C0" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="325.0" y="152.2" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1C1C1C">call</text>
<rect x="680" y="60" width="270" height="64" rx="6" fill="white" stroke="#1B4F72" stroke-width="2"/>
<text x="815.0" y="89.7" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1C1C1C">Simulator</text>
<text x="815.0" y="113.9" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="400" text-anchor="middle" fill="#7FA3C0">compile, run seed, coverage</text>
