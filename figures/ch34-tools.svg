<text x="815.0" y="179.7" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1C1C1C">Formal engine</text>
<text x="815.0" y="203.9" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="400" text-anchor="middle" fill="#7FA3C0">prove, refute, vacuity</text>
<path d="M680,250 A135.0,10 0 0 1 950,250 V294 A135.0,10 0 0 1 680,294 Z" fill="#F4F6F8" stroke="#1B4F72" stroke-width="2"/>
<path d="M680,250 A135.0,10 0 0 0 950,250" fill="none" stroke="#1B4F72" stroke-width="2"/>
<text x="815.0" y="282.6" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1C1C1C">Coverage DB</text>
<path d="M680,340 A135.0,10 0 0 1 950,340 V384 A135.0,10 0 0 1 680,384 Z" fill="#F4F6F8" stroke="#1B4F72" stroke-width="2"/>
<path d="M680,340 A135.0,10 0 0 0 950,340" fill="none" stroke="#1B4F72" stroke-width="2"/>
<text x="815.0" y="372.6" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1C1C1C">Waveforms, logs</text>
<path d="M610,118.0 L680,92.0" fill="none" stroke="#7FA3C0" stroke-width="2.2" marker-end="url(#ah)"/>
<path d="M610,118.0 L680,182.0" fill="none" stroke="#7FA3C0" stroke-width="2.2" marker-end="url(#ah)"/>
<path d="M610,118.0 L680,272.0" fill="none" stroke="#7FA3C0" stroke-width="2.2" marker-end="url(#ah)"/>
<path d="M610,118.0 L680,362.0" fill="none" stroke="#7FA3C0" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="350" y="200" width="300" height="75" rx="6" fill="#F4F6F8" stroke="#CBD2D9"/>
<text x="360" y="222.5" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1C1C1C">Exposed: compile, run with a seed,</text>
<text x="360" y="242.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1C1C1C">fetch coverage, fetch failures,</text>
<text x="360" y="261.5" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1C1C1C">fetch a waveform slice.</text>
<rect x="350" y="330" width="300" height="75" rx="6" fill="#F4F6F8" stroke="#CBD2D9"/>
<text x="360" y="352.5" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1C1C1C">Never exposed to a stimulus agent:</text>
<text x="360" y="372.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1C1C1C">the checker&#x27;s source, the coverage</text>
<text x="360" y="391.5" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1C1C1C">model, the reference model.</text>
<rect x="350" y="450" width="600" height="54" rx="6" fill="#F4F6F8" stroke="#CBD2D9"/>
<text x="360" y="472.5" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1C1C1C">A simulation is an expensive tool call.</text>
<text x="360" y="492.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1C1C1C">The loop is designed around that cost.</text>
<rect x="20" y="570" width="960" height="300" rx="12" fill="none" stroke="#7FA3C0" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="32" y="592.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#7FA3C0">Verification counterpart: this book&#x27;s build system is already a tool interface</text>
<rect x="60" y="650" width="360" height="76" rx="6" fill="white" stroke="#1B4F72" stroke-width="2"/>
<text x="240.0" y="685.6" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1C1C1C">make lint | run | clean</text>
<text x="240.0" y="709.9" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="400" text-anchor="middle" fill="#7FA3C0">three uniform targets</text>
<path d="M540,660 A190.0,10 0 0 1 920,660 V716 A190.0,10 0 0 1 540,716 Z" fill="#F4F6F8" stroke="#1B4F72" stroke-width="2"/>
<path d="M540,660 A190.0,10 0 0 0 920,660" fill="none" stroke="#1B4F72" stroke-width="2"/>
<text x="730.0" y="690.6" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1C1C1C">examples/status.json</text>
<text x="730.0" y="712.9" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#7FA3C0">pass, fail, expect</text>
<path d="M420,688.0 L540,688.0" fill="none" stroke="#7FA3C0" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="480.0" y="685.2" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1C1C1C">writes</text>
<text x="60" y="800.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#7FA3C0">A harness that calls these two has everything a stimulus agent needs, and nothing it must not have.</text>
</svg>
