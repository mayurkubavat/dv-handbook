<text x="1190.0" y="384.2" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#7FA3C0">simulator output, formal verdict, coverage DB</text>
