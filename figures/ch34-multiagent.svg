<path d="M1190.0,330 L1190.0,264" fill="none" stroke="#5B3E8E" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ahj)"/>
<text x="1190.0" y="293.2" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#5B3E8E">what A did not hold</text>
<rect x="40" y="420" width="1320" height="32" rx="6" fill="#F4F6F8" stroke="#CBD2D9"/>
<text x="50" y="441.1" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1C1C1C">A verifier that shares the generator&#x27;s evidence agrees with it. A verifier helps only when it holds evidence the generator does not: the toolchain&#x27;s verdict, never a second reading of the same prompt.</text>
<text x="40" y="505.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#7FA3C0">Verification counterpart: designer, verifier, formal engineer and sign-off reviewer, whose value has always been their independence.</text>
</svg>
