<text x="700.0" y="384.2" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#7FA3C0">what every agent was told</text>
<path d="M1000,340 A190.0,10 0 0 1 1380,340 V384 A190.0,10 0 0 1 1000,384 Z" fill="#F4F6F8" stroke="#1B4F72" stroke-width="2"/>
