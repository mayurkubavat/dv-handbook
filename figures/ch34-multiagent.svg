<text x="410.0" y="457.6" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1C1C1C">Shared prompt and summaries</text>
<text x="410.0" y="479.9" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#7FA3C0">what every agent was told</text>
<path d="M620,430 A180.0,10 0 0 1 980,430 V480 A180.0,10 0 0 1 620,480 Z" fill="#F4F6F8" stroke="#1B4F72" stroke-width="2"/>
