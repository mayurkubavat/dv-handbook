<text x="560" y="175.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#B7791F">&#x27;A says done;</text>
<text x="560" y="194.5" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#B7791F">analyze&#x27;</text>
<path d="M230,430 A180.0,10 0 0 1 590,430 V480 A180.0,10 0 0 1 230,480 Z" fill="#F4F6F8" stroke="#1B4F72" stroke-width="2"/>
