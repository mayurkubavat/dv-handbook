<text x="825.0" y="332.2" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#5B3E8E">what A did not hold</text>
<rect x="40" y="540" width="930" height="75" rx="6" fill="#F4F6F8" stroke="#CBD2D9"/>
<text x="50" y="562.5" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1C1C1C">A verifier that shares the generator&#x27;s evidence agrees with it. A verifier helps only when</text>
<text x="50" y="582.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1C1C1C">it holds evidence the generator does not: the toolchain&#x27;s verdict, never a second reading</text>
<text x="50" y="601.5" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1C1C1C">of the same prompt.</text>
<text x="40" y="690.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#7FA3C0">Counterpart: designer, verifier, formal engineer, sign-off reviewer, valued for their independence.</text>
</svg>
