<text x="50.0" y="138.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="12" font-weight="400" text-anchor="end" fill="#7FA3C0">reset</text>
<circle cx="345" cy="210" r="46" fill="white" stroke="#1B4F72" stroke-width="2.5"/>
<text x="345" y="207.2" font-family="'JetBrains Mono', Menlo, monospace" font-size="15" font-weight="700" text-anchor="middle" fill="#1C1C1C">age 1</text>
<text x="345" y="226.2" font-family="'JetBrains Mono', Menlo, monospace" font-size="12" font-weight="400" text-anchor="middle" fill="#7FA3C0">waiting[0]</text>
