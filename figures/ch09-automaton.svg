<text x="140.0" y="124.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#7FA3C0">at every tick</text>
<text x="30.0" y="398.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1C1C1C">The same three states as a shift register: several can be set at once, one per request still waiting.</text>
