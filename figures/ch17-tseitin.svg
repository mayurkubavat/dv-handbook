<text x="40.0" y="430.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#7FA3C0">an inverter needs no variable: negate the literal</text>
<text x="40.0" y="450.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#7FA3C0">8 variables, 17 clauses; the question is added as unit clauses</text>
<text x="690.0" y="108.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#1B4F72">p = a xor b</text>
<text x="704.0" y="128.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="400" text-anchor="start" fill="#1C1C1C">(-4 1 2)</text>
<text x="834.0" y="128.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="400" text-anchor="start" fill="#1C1C1C">(-4 -1 -2)</text>
<text x="704.0" y="147.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="400" text-anchor="start" fill="#1C1C1C">(4 -1 2)</text>
<text x="834.0" y="147.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="400" text-anchor="start" fill="#1C1C1C">(4 1 -2)</text>
<text x="690.0" y="188.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#1B4F72">sum = p xor cin</text>
<text x="704.0" y="208.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="400" text-anchor="start" fill="#1C1C1C">(-5 4 3)</text>
<text x="834.0" y="208.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="400" text-anchor="start" fill="#1C1C1C">(-5 -4 -3)</text>
<text x="704.0" y="227.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="400" text-anchor="start" fill="#1C1C1C">(5 -4 3)</text>
<text x="834.0" y="227.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="400" text-anchor="start" fill="#1C1C1C">(5 4 -3)</text>
<text x="690.0" y="268.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#1B4F72">g = a and b</text>
<text x="704.0" y="288.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="400" text-anchor="start" fill="#1C1C1C">(-6 1)</text>
<text x="834.0" y="288.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="400" text-anchor="start" fill="#1C1C1C">(-6 2)</text>
<text x="704.0" y="307.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="400" text-anchor="start" fill="#1C1C1C">(6 -1 -2)</text>
<text x="690.0" y="348.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#1B4F72">t = p and cin</text>
<text x="704.0" y="368.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="400" text-anchor="start" fill="#1C1C1C">(-7 4)</text>
<text x="834.0" y="368.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="400" text-anchor="start" fill="#1C1C1C">(-7 3)</text>
<text x="704.0" y="387.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="400" text-anchor="start" fill="#1C1C1C">(7 -4 -3)</text>
<text x="690.0" y="428.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#1B4F72">cout = g or t</text>
<text x="704.0" y="448.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="400" text-anchor="start" fill="#1C1C1C">(8 -6)</text>
<text x="834.0" y="448.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="400" text-anchor="start" fill="#1C1C1C">(8 -7)</text>
<text x="704.0" y="467.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="400" text-anchor="start" fill="#1C1C1C">(-8 6 7)</text>
