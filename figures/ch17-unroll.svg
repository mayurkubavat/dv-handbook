<text x="30.0" y="400.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#7FA3C0">Bound k: k transitions, k + 1 frames. State t+1 is frame t&#x27;s next-state wires, so a register adds no clause.</text>
