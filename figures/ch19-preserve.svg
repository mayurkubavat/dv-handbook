<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Three panels of nested ovals: an over-approximation with a spurious trace outside the design, an under-approximation with a missed bug outside the restriction, and an exact change where the two coincide">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7FA3C0"/></marker><marker id="ahj" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#5B3E8E"/></marker><marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1B4F72"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B7791F"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1C1C1C"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#CBD2D9" stroke-width="2"/></pattern></defs>
<rect width="1000" height="470" fill="white"/>
<text x="30" y="40.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#1B4F72">Which answers survive a change to the problem</text>
<text x="30" y="64.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1C1C1C">Behaviors of the design, and of the changed problem.</text>
<text x="170.0" y="108.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1B4F72">over-approximation</text>
<text x="170.0" y="128.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#1C1C1C">keeps proofs</text>
<ellipse cx="170" cy="230" rx="140" ry="82" fill="#DCE9F3" stroke="#1B4F72" stroke-width="2"/>
<ellipse cx="140" cy="238" rx="80" ry="50" fill="white" stroke="#123A56" stroke-width="2"/>
<text x="140.0" y="243.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#1C1C1C">design</text>
<text x="230.0" y="176.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" fill="#1B4F72">changed problem</text>
<line x1="257.0" y1="231.0" x2="275.0" y2="249.0" stroke="#B03A2E" stroke-width="3"/>
<line x1="257.0" y1="249.0" x2="275.0" y2="231.0" stroke="#B03A2E" stroke-width="3"/>
<text x="266.0" y="268.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#B03A2E">spurious</text>
<text x="170.0" y="350.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#7FA3C0">black box, cut point,</text>
<text x="170.0" y="369.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#7FA3C0">timer, memory and</text>
<text x="170.0" y="388.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#7FA3C0">initial-value abstraction</text>
<text x="500.0" y="108.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1B4F72">under-approximation</text>
<text x="500.0" y="128.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#1C1C1C">keeps counterexamples</text>
<ellipse cx="500" cy="230" rx="140" ry="82" fill="white" stroke="#123A56" stroke-width="2"/>
<ellipse cx="464" cy="236" rx="74" ry="46" fill="#FBF1DC" stroke="#B7791F" stroke-width="2"/>
<text x="464.0" y="241.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#1C1C1C">changed</text>
<text x="540.0" y="174.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1C1C1C">design</text>
<line x1="581.0" y1="231.0" x2="599.0" y2="249.0" stroke="#B03A2E" stroke-width="3"/>
<line x1="581.0" y1="249.0" x2="599.0" y2="231.0" stroke="#B03A2E" stroke-width="3"/>
<text x="590.0" y="268.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#B03A2E">missed</text>
<text x="500.0" y="350.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#7FA3C0">over-constraint for hunting,</text>
<text x="500.0" y="369.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#7FA3C0">bounded proof,</text>
<text x="500.0" y="388.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#7FA3C0">cover-guided search</text>
<text x="830.0" y="108.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1B4F72">exact for the property</text>
<text x="830.0" y="128.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#1C1C1C">keeps both</text>
<ellipse cx="830" cy="230" rx="140" ry="82" fill="#E6F2E7" stroke="#2E7D32" stroke-width="2"/>
<ellipse cx="830" cy="230" rx="134" ry="76" fill="none" stroke="#123A56" stroke-width="2" stroke-dasharray="6 4"/>
<text x="830.0" y="235.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#1C1C1C">design = changed problem</text>
<text x="830.0" y="350.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#7FA3C0">symbolic constant, oracle,</text>
<text x="830.0" y="369.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#7FA3C0">ghost state,</text>
<text x="830.0" y="388.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#7FA3C0">history variable</text>
<text x="30.0" y="440.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#7FA3C0">For a cover the rule runs the other way: a cover reached on an over-approximation may be unreachable in the design.</text>
</svg>
