<text x="580.0" y="149.2" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1C1C1C">P(next token)</text>
<path d="M710.0,184 L710.0,270" fill="none" stroke="#7FA3C0" stroke-width="2.2" marker-end="url(#ah)"/>
<path d="M610,305.0 Q300.0,317.5 150.0,190" fill="none" stroke="#7FA3C0" stroke-width="2.2" marker-end="url(#ah)"/>
