<path d="M610,280 A100.0,10 0 0 0 810,280" fill="none" stroke="#1B4F72" stroke-width="2"/>
<text x="710.0" y="307.6" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1C1C1C">Output</text>
<text x="710.0" y="329.9" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#7FA3C0">one token</text>
