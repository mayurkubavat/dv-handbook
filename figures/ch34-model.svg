<text x="50" y="372.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#7FA3C0">Fluent by construction; correct only where data and prompt make it so;</text>
<text x="50" y="391.5" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#7FA3C0">different on every run unless the seed is fixed.</text>
<rect x="20" y="420" width="960" height="380" rx="12" fill="none" stroke="#7FA3C0" stroke-width="1.5" stroke-dasharray="6 5"/>
