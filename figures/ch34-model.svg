<text x="92" y="828.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1C1C1C">model</text>
<rect x="160" y="812" width="44" height="22" rx="4" fill="white" stroke="#1B4F72" stroke-width="1.5"/>
<text x="212" y="828.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1C1C1C">tool</text>
<path d="M270,817 A22,5 0 0 1 314,817 V829 A22,5 0 0 1 270,829 Z" fill="#F4F6F8" stroke="#1B4F72" stroke-width="1.5"/>
<text x="322" y="828.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1C1C1C">evidence store</text>
