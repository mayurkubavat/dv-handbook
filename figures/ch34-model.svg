<text x="525.0" y="159.2" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#1C1C1C">Sampler</text>
<text x="525.0" y="180.2" font-family="'JetBrains Mono', Menlo, monospace" font-size="12" font-weight="400" text-anchor="middle" fill="#7FA3C0">temperature, seed</text>
<path d="M450,280 A75.0,10 0 0 1 600,280 V330 A75.0,10 0 0 1 450,330 Z" fill="#F4F6F8" stroke="#1B4F72" stroke-width="2"/>
