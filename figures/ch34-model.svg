<path d="M590,552.0 L650,555.0" fill="none" stroke="#7FA3C0" stroke-width="2.2" marker-end="url(#ah)"/>
<path d="M750.0,590 Q450.0,700.0 150.0,590" fill="none" stroke="#7FA3C0" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="450.0" y="680.2" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1C1C1C">next transaction</text>
<text x="50" y="772.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#7FA3C0">Same shape: a space, a sampler, a seed. The prompt is the constraint set.</text>
