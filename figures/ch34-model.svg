<path d="M1215.0,194 L1215.0,270" fill="none" stroke="#7FA3C0" stroke-width="2.2" marker-end="url(#ah)"/>
<path d="M1140,305.0 Q927.5,312.5 835.0,200" fill="none" stroke="#7FA3C0" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="957.5" y="278.7" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1C1C1C">next transaction</text>
<text x="760" y="370.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#7FA3C0">Same shape: a space, a sampler, a seed. The prompt is the constraint set.</text>
<rect x="60" y="405" width="44" height="22" rx="11" fill="#1B4F72"/>
<text x="112" y="421.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#1C1C1C">model</text>
