<path d="M525.0,194 L525.0,270" fill="none" stroke="#7FA3C0" stroke-width="2.2" marker-end="url(#ah)"/>
<path d="M450,305.0 Q227.5,312.5 125.0,200" fill="none" stroke="#7FA3C0" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="257.5" y="278.7" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1C1C1C">append and repeat</text>
<text x="50" y="370.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#7FA3C0">Fluent by construction. Correct only where the data and the prompt make it so. Different on every run unless the seed is fixed.</text>
