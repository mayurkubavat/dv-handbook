<rect width="1000" height="470" fill="white"/>
<text x="30" y="40.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#1B4F72">The chain is sound; the first links are the work</text>
<text x="30" y="64.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1C1C1C">An end-to-end property of the DMA&#x27;s channel 0, its two lemmas, and the verdicts of the decomp example.</text>
