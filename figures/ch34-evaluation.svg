<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="Visible and hidden metrics, and the gap between them">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7FA3C0"/></marker><marker id="ahj" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#5B3E8E"/></marker></defs>
<rect width="1000" height="640" fill="white"/>
<rect x="40" y="200" width="230" height="64" rx="32.0" fill="#1B4F72" stroke="#123A56" stroke-width="2"/>
<text x="155.0" y="230.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="white">Generator</text>
<text x="155.0" y="253.9" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#DCE9F3">optimizes what it sees</text>
<path d="M330,210 A100.0,10 0 0 1 530,210 V260 A100.0,10 0 0 1 330,260 Z" fill="#F4F6F8" stroke="#1B4F72" stroke-width="2"/>
<path d="M330,210 A100.0,10 0 0 0 530,210" fill="none" stroke="#1B4F72" stroke-width="2"/>
<text x="430.0" y="237.7" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1C1C1C">Artifact</text>
<text x="430.0" y="259.9" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#7FA3C0">code, test, stimulus</text>
<path d="M270,232.0 L330,235.0" fill="none" stroke="#7FA3C0" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="620" y="60" width="260" height="80" rx="6" fill="white" stroke="#1B4F72" stroke-width="2"/>
<text x="750.0" y="97.7" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1C1C1C">Visible metric</text>
<text x="750.0" y="121.9" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="400" text-anchor="middle" fill="#7FA3C0">the tests it can see</text>
<rect x="620" y="340" width="260" height="80" rx="6" fill="white" stroke="#1B4F72" stroke-width="2"/>
<text x="750.0" y="377.6" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1C1C1C">Hidden metric</text>
<text x="750.0" y="401.9" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="400" text-anchor="middle" fill="#7FA3C0">held-out tests, mutants</text>
<path d="M530,235.0 L620,100.0" fill="none" stroke="#5B3E8E" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ahj)"/>
<path d="M530,235.0 L620,380.0" fill="none" stroke="#5B3E8E" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ahj)"/>
<text x="640" y="175.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#2E7D32">satisfied</text>
<text x="640" y="455.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#B7791F">not satisfied</text>
<path d="M760,150 V335" stroke="#B7791F" stroke-width="3" stroke-dasharray="8 6"/>
<text x="780" y="235.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1C1C1C">the gap: what the generator was</text>
<text x="780" y="254.5" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1C1C1C">optimized against, versus what</text>
<text x="780" y="274.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1C1C1C">mattered</text>
<rect x="20" y="500" width="960" height="120" rx="12" fill="none" stroke="#1B4F72" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="32" y="522.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1B4F72">Verification counterpart</text>
<text x="40" y="555.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1C1C1C">Visible: coverage (a proxy).   Hidden: bug-finding power (mutants killed).</text>
<text x="40" y="574.5" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1C1C1C">Measured on small designs: coverage near 90 percent; fault detection near 14 percent.</text>
</svg>
