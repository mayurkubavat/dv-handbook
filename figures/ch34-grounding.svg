<text x="1010" y="80.4" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#1C1C1C">Nominal window: very large.</text>
<text x="1010" y="96.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#1C1C1C">Effective attention: much smaller.</text>
<text x="1010" y="111.6" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#1C1C1C">What is included matters more</text>
