<rect x="40" y="530" width="930" height="54" rx="6" fill="#F4F6F8" stroke="#CBD2D9"/>
<text x="50" y="552.5" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1C1C1C">Nominal window: very large. Effective attention: much smaller.</text>
<text x="50" y="572.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1C1C1C">What is included matters more than how much.</text>
<text x="40" y="640.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#7FA3C0">Nothing outside the context exists for the model. It produces a plausible</text>
<text x="40" y="659.5" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#7FA3C0">substitute for whatever it was not given.</text>
