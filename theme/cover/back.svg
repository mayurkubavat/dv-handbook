<rect x="1860" y="2664" width="60" height="60" fill="none" stroke="#1B4F72" stroke-width="10"/>
<rect x="1880" y="2684" width="20" height="20" fill="#1B4F72"/>
<rect x="1644" y="2880" width="60" height="60" fill="none" stroke="#1B4F72" stroke-width="10"/>
