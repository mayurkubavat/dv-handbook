name: book

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    name: Check examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The book measures Verilator 5.052, Icarus Verilog 13.0 and Yosys
      # 0.68. Ubuntu's packages are older (5.020, 12.0 and 0.33 on 24.04),
      # and Chapters 5 and 6 do not build on that Verilator, so the three
      # are built from their release tags and cached by version.
      # The runner image's name goes into the cache key so that binaries
      # built on one Ubuntu are not restored on the next when ubuntu-latest
      # moves. ImageOS is a process variable on hosted runners, not part of
      # the env context, so a step copies it into GITHUB_ENV first.
      - name: Name the runner image for the cache key
        run: echo "IMAGE_OS=${ImageOS:-unknown}" >> "$GITHUB_ENV"
      - name: Restore the pinned simulators
        id: tools
        uses: actions/cache@v5
        with:
          path: /opt/dvtools
          key: dvtools-verilator-v5.052-iverilog-v13_0-yosys-v0.68-${{ runner.os }}-${{ env.IMAGE_OS }}
      - name: Build the pinned simulators
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q git make g++ autoconf flex bison help2man \
            perl python3 libfl-dev zlib1g-dev gperf libreadline-dev gawk \
            tcl-dev libffi-dev pkg-config cmake clang lld
          sudo mkdir -p /opt/dvtools && sudo chown "$USER" /opt/dvtools
          git clone -q --depth 1 --branch v5.052 https://github.com/verilator/verilator /tmp/verilator
          (cd /tmp/verilator && autoconf && ./configure --prefix=/opt/dvtools >/dev/null && make -s -j"$(nproc)" && make -s install)
          git clone -q --depth 1 --branch v13_0 https://github.com/steveicarus/iverilog /tmp/iverilog
          (cd /tmp/iverilog && sh autoconf.sh && ./configure --prefix=/opt/dvtools >/dev/null && make -s -j"$(nproc)" && make -s install)
          # Yosys builds with CMake from 0.6x; its README's three commands.
          git clone -q --depth 1 --branch v0.68 --recurse-submodules https://github.com/YosysHQ/yosys /tmp/yosys
          (cd /tmp/yosys && cmake -B build . -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/opt/dvtools >/dev/null \
             && cmake --build build --config Release --parallel "$(nproc)" >/dev/null \
             && cmake --install build --strip >/dev/null)
      - name: Put the pinned simulators on the PATH and report their versions
        run: |
          echo /opt/dvtools/bin >> "$GITHUB_PATH"
          sudo apt-get update -q
          sudo apt-get install -y -q make g++ libfl2 libreadline8t64 tcl libffi8
          sudo apt-get install -y -q libsystemc-dev || echo "no libsystemc-dev; SystemC examples will be skipped"
          /opt/dvtools/bin/verilator --version
          /opt/dvtools/bin/iverilog -V | head -1
          /opt/dvtools/bin/yosys -V
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Install cocotb, pyuvm, pytest, jsonschema and the z3 solver
        # Verilator's runtime finds the solver on the PATH; the pip wheel puts
        # a z3 binary next to python.
        run: pip install cocotb pyuvm pyyaml pytest jsonschema z3-solver
      - name: Lint and run every example
        env:
          SYSTEMC_HOME: /usr
        run: scripts/check-examples.sh
      - uses: actions/upload-artifact@v7
        with: { name: examples-status, path: examples/status.json }

  build:
    name: Render book
    needs: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
        # The setup action resolves the latest Quarto and TinyTeX releases
        # through the GitHub API. Without a token those calls are anonymous
        # and rate-limited per runner IP, which fails the build with
        # "Unable to determine latest release" for reasons that have nothing
        # to do with this repository.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install librsvg, poppler and the book fonts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q librsvg2-bin poppler-utils fontconfig unzip
          mkdir -p ~/.fonts && cd ~/.fonts
          curl -sSL -o ss.zip https://github.com/adobe-fonts/source-sans/releases/download/3.052R/OTF-source-sans-3.052R.zip
          curl -sSL -o sf.zip https://github.com/adobe-fonts/source-serif/releases/download/4.005R/source-serif-4.005_Desktop.zip
          curl -sSL -o jb.zip https://github.com/JetBrains/JetBrainsMono/releases/download/v2.304/JetBrainsMono-2.304.zip
          for z in ss sf jb; do unzip -q -o $z.zip -d $z; done
          # Static instances only: variable fonts ("[wght]" in the name) and the
          # NL (no-ligature) family confuse xdvipdfmx and fontconfig selection.
          find ss sf -name '*.otf' | grep -viE 'variable|\[' | xargs -I{} cp {} .
          find jb -path '*fonts/ttf/*' -name 'JetBrainsMono-*.ttf' | xargs -I{} cp {} .
          rm -rf ss sf jb *.zip
          fc-cache -f
          echo "installed font files: $(/bin/ls *.otf *.ttf | wc -l)"
          fc-list : family style | grep -E 'Source Sans 3|Source Serif 4|JetBrains Mono' | sort -u | head -40
      - name: Render PDF (with cover) and web edition
        run: |
          scripts/build-book.sh
          cp _book/Design-Verification-draft.pdf _book/Design-Verification-${{ github.ref_name }}.pdf
          # The web edition goes to its own directory: a second render into
          # _book would delete the other format's output.
          quarto render --to html --output-dir _site
          cp _book/Design-Verification-draft.pdf _site/Design-Verification-draft.pdf
          test -f _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with: { path: _site }
      - uses: actions/upload-artifact@v7
        with:
          name: book-pdf
          path: _book/Design-Verification-*.pdf

  deploy:
    name: Deploy web edition
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: Attach PDF to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { name: book-pdf, path: pdf }
      - uses: softprops/action-gh-release@v3
        with:
          files: pdf/Design-Verification-*.pdf
          generate_release_notes: true
